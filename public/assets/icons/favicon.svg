<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- subtle inner highlight -->
  <rect x="16" y="16" width="480" height="240" rx="108" fill="#ffffff" opacity="0.06"/>

  <!-- </M> drawn as vector paths (order fixed regardless of text direction) -->
  <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- opening bracket < -->
    <path d="M148 176 L88 256 L148 336"/>
    <!-- slash / -->
    <path d="M226 176 L186 336"/>
    <!-- capital M -->
    <path d="M264 336 L264 176 L322 268 L380 176 L380 336"/>
    <!-- closing bracket > -->
    <path d="M418 176 L478 256 L418 336"/>
  </g>
</svg>
