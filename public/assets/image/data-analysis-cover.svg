<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5b9bf7" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22d3ee" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- bar chart -->
  <g>
    <rect x="120" y="380" width="46" height="140" rx="6" fill="url(#barGrad1)"/>
    <rect x="186" y="320" width="46" height="200" rx="6" fill="url(#barGrad2)"/>
    <rect x="252" y="260" width="46" height="260" rx="6" fill="url(#barGrad1)"/>
    <rect x="318" y="220" width="46" height="300" rx="6" fill="url(#barGrad2)"/>
    <rect x="384" y="180" width="46" height="340" rx="6" fill="url(#barGrad1)"/>
  </g>

  <!-- baseline -->
  <line x1="100" y1="520" x2="460" y2="520" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- trend line with markers -->
  <g fill="none" stroke="url(#lineGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 130 460 L 230 400 L 320 430 L 410 320 L 500 260 L 590 300 L 670 200"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="130" cy="460" r="5"/>
    <circle cx="230" cy="400" r="5"/>
    <circle cx="320" cy="430" r="5"/>
    <circle cx="410" cy="320" r="5"/>
    <circle cx="500" cy="260" r="5"/>
    <circle cx="590" cy="300" r="5"/>
    <circle cx="670" cy="200" r="6" fill="#22d3ee"/>
  </g>

  <!-- scatter dots (top right, PCA-ish cluster) -->
  <g fill="#5b9bf7" fill-opacity="0.8">
    <circle cx="560" cy="120" r="5"/>
    <circle cx="600" cy="100" r="4"/>
    <circle cx="630" cy="140" r="6"/>
    <circle cx="670" cy="110" r="4"/>
    <circle cx="695" cy="150" r="5"/>
    <circle cx="620" cy="170" r="4"/>
    <circle cx="655" cy="90" r="3.5"/>
  </g>

  <!-- floating card: dataset table hint -->
  <g transform="translate(500,340)">
    <rect x="0" y="0" width="220" height="150" rx="16" fill="#0f1729" stroke="#22d3ee" stroke-opacity="0.18"/>
    <rect x="20" y="24" width="180" height="10" rx="5" fill="#22d3ee" fill-opacity="0.35"/>
    <rect x="20" y="48" width="140" height="8" rx="4" fill="#5b9bf7" fill-opacity="0.3"/>
    <rect x="20" y="66" width="160" height="8" rx="4" fill="#5b9bf7" fill-opacity="0.22"/>
    <rect x="20" y="84" width="110" height="8" rx="4" fill="#5b9bf7" fill-opacity="0.22"/>
    <rect x="20" y="108" width="70" height="24" rx="8" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="55" y="124" font-family="monospace" font-size="11" fill="#67e8f9" text-anchor="middle">R² 0.87</text>
  </g>

  <!-- python-ish accent glyph, subtle -->
  <text x="110" y="140" font-family="monospace" font-size="26" fill="#22d3ee" fill-opacity="0.35">import pandas as pd</text>
  <text x="110" y="170" font-family="monospace" font-size="22" fill="#5b9bf7" fill-opacity="0.3">from sklearn import PCA</text>
</svg>
